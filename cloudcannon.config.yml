# Bundle image regions test. The blog collections each hold one post and
# differ only in the cover input's paths. See README.md.

_enabled_editors:
  - visual
  - content
  - data

collections_config:
  pages:
    path: content
    glob:
      - _index.md
      - blog/_index.md
    url: /[full_slug]/
    name: Pages
    icon: wysiwyg
    disable_add: true

  blog_v1:
    path: content/blog
    glob:
      - v1/index.md
    url: /blog/[full_slug]/
    name: 'V1: static ""'
    icon: post_add
    disable_add: true
    _inputs:
      cover:
        type: image
        options:
          paths:
            uploads: content/blog/[full_slug]/
            static: ""
            uploads_use_relative_path: true

  blog_v2:
    path: content/blog
    glob:
      - v2/index.md
    url: /blog/[full_slug]/
    name: "V2: static = bundle, relative on"
    icon: post_add
    disable_add: true
    _inputs:
      cover:
        type: image
        options:
          paths:
            uploads: content/blog/[full_slug]/
            static: content/blog/[full_slug]/
            uploads_use_relative_path: true

  blog_v3:
    path: content/blog
    glob:
      - v3/index.md
    url: /blog/[full_slug]/
    name: "V3: static = bundle, relative off"
    icon: post_add
    disable_add: true
    _inputs:
      cover:
        type: image
        options:
          paths:
            uploads: content/blog/[full_slug]/
            static: content/blog/[full_slug]/
            uploads_use_relative_path: false

  blog_v4:
    path: content/blog
    glob:
      - v4/index.md
    url: /blog/[full_slug]/
    name: "V4: static = this bundle, no placeholder"
    icon: post_add
    disable_add: true
    _inputs:
      cover:
        type: image
        options:
          paths:
            uploads: content/blog/[full_slug]/
            static: content/blog/v4/
            uploads_use_relative_path: true

  blog_v5:
    path: content/blog
    glob:
      - v5/index.md
    url: /blog/[full_slug]/
    name: "V5: static = this bundle, relative off"
    icon: post_add
    disable_add: true
    _inputs:
      cover:
        type: image
        options:
          paths:
            uploads: content/blog/[full_slug]/
            static: content/blog/v5/
            uploads_use_relative_path: false

  blog_v6:
    path: content/blog
    glob:
      - v6/index.md
    url: /blog/[full_slug]/
    name: "V6: uploads and static empty, relative on"
    icon: post_add
    disable_add: true
    _inputs:
      cover:
        type: image
        options:
          paths:
            uploads: ""
            static: ""
            uploads_use_relative_path: true

  blog_v7:
    path: content/blog
    glob:
      - v7/index.md
    url: /blog/[full_slug]/
    name: "V7: no uploads or static, relative on"
    icon: post_add
    disable_add: true
    _inputs:
      cover:
        type: image
        options:
          paths:
            uploads_use_relative_path: true

  blog_v8:
    path: content/blog
    glob:
      - v8/index.md
    url: /blog/[full_slug]/
    name: "V8: uploads = bundle, no static, relative on"
    icon: post_add
    disable_add: true
    _inputs:
      cover:
        type: image
        options:
          paths:
            uploads: content/blog/[full_slug]/
            uploads_use_relative_path: true

  blog_v9:
    path: content/blog
    glob:
      - v9/index.md
    url: /blog/[full_slug]/
    name: "V9: uploads = bundle, no static, relative off"
    icon: post_add
    disable_add: true
    _inputs:
      cover:
        type: image
        options:
          paths:
            uploads: content/blog/[full_slug]/
            uploads_use_relative_path: false

  blog_v10:
    path: content/blog
    glob:
      - v10/index.md
    url: /blog/[full_slug]/
    name: "V10: static = content, relative off"
    icon: post_add
    disable_add: true
    _inputs:
      cover:
        type: image
        options:
          paths:
            uploads: content/blog/[full_slug]/
            static: content
            uploads_use_relative_path: false

  blog_v11:
    path: content/blog
    glob:
      - v11/index.md
    url: /blog/[full_slug]/
    name: "V11: static = content, relative on"
    icon: post_add
    disable_add: true
    _inputs:
      cover:
        type: image
        options:
          paths:
            uploads: content/blog/[full_slug]/
            static: content
            uploads_use_relative_path: true

_inputs:
  control:
    type: image
    options:
      paths:
        uploads: static/images
        static: static
