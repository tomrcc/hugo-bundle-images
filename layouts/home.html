{{ define "main" }}
<h1>{{ .Title }}</h1>
<ul>
  <li><a href="/blog/">Blog list</a></li>
  {{- range (site.GetPage "/blog").Pages.ByTitle }}
  <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
  {{- end }}
</ul>

{{- with site.GetPage "/blog/v1" }}
<section class="box">
  <h2>Component region: V1 cover off its own page</h2>
  <div data-editable="component" data-component="bundle-cover" data-prop="@file[/content/{{ .File.Path }}]">
    {{- partial "bundle-cover" .Params -}}
  </div>
</section>
{{- end }}
{{ end }}
